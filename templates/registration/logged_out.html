<!-- accounts/templates/registration/logged_out.html -->
{% extends 'base.html' %}

{% block title %}تم تسجيل الخروج - AHM متجر{% endblock %}

{% block extra_css %}
<style>
    /* حاوية الصفحة */
    .logout-container {
        max-width: 500px;
        margin: 80px auto;
        padding: 0 20px;
    }

    .logout-card {
        background: white;
        border-radius: 25px;
        padding: 50px 40px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        border: 1px solid var(--border-light);
        text-align: center;
        transition: all 0.3s ease;
    }

    .logout-card:hover {
        box-shadow: 0 20px 40px rgba(212, 168, 83, 0.1);
        border-color: var(--primary-light);
    }

    /* أيقونة النجاح */
    .success-icon {
        width: 100px;
        height: 100px;
        background: var(--primary-light);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px;
        animation: pulse-success 0.5s ease;
    }

    .success-icon i {
        font-size: 3.5em;
        color: var(--success-color);
    }

    @keyframes pulse-success {
        0% {
            transform: scale(0.8);
            opacity: 0;
        }
        50% {
            transform: scale(1.1);
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    /* عنوان الصفحة */
    .logout-header h2 {
        font-size: 2em;
        color: var(--dark-bg);
        font-weight: 700;
        margin-bottom: 15px;
    }

    .logout-header p {
        color: var(--text-muted);
        font-size: 1em;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    /* زر تسجيل الدخول */
    .btn-login {
        width: 100%;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-decoration: none;
        margin-bottom: 25px;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(212, 168, 83, 0.3);
        color: white;
    }

    .btn-login:active {
        transform: translateY(0);
    }

    /* الفاصل */
    .divider {
        position: relative;
        text-align: center;
        margin: 20px 0;
    }

    .divider::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--border-light);
    }

    .divider span {
        position: relative;
        background: white;
        padding: 0 15px;
        color: var(--text-muted);
        font-size: 0.9em;
    }

    /* رابط الصفحة الرئيسية */
    .home-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        text-decoration: none;
        transition: all 0.3s ease;
        font-size: 0.95em;
    }

    .home-link:hover {
        color: var(--primary-color);
        gap: 12px;
    }

    /* أيقونة وداع */
    .farewell-icon {
        margin-top: 25px;
        opacity: 0.5;
    }

    .farewell-icon i {
        font-size: 2em;
        color: var(--primary-color);
    }

    /* تحسينات للشاشات الصغيرة */
    @media (max-width: 576px) {
        .logout-card {
            padding: 35px 25px;
        }

        .success-icon {
            width: 70px;
            height: 70px;
        }

        .success-icon i {
            font-size: 2.5em;
        }

        .logout-header h2 {
            font-size: 1.6em;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="logout-container">
    <div class="logout-card">
        <!-- أيقونة النجاح -->
        <div class="success-icon">
            <i class="bi bi-check-circle-fill"></i>
        </div>

        <!-- عنوان ورسالة -->
        <div class="logout-header">
            <h2>تم تسجيل الخروج بنجاح</h2>
            <p>
                <i class="bi bi-emoji-smile"></i>
                شكراً لزيارتك متجر AHM
                <br>
                نتمنى رؤيتك مرة أخرى قريباً
            </p>
        </div>

        <!-- زر تسجيل الدخول -->
        <a href="{% url 'login' %}" class="btn-login">
            <i class="bi bi-box-arrow-in-right"></i>
            تسجيل الدخول مرة أخرى
            <i class="bi bi-arrow-left"></i>
        </a>

        <!-- الفاصل -->
        <div class="divider">
            <span>أو</span>
        </div>

        <!-- رابط الصفحة الرئيسية -->
        <a href="/" class="home-link">
            <i class="bi bi-house-door"></i>
            العودة إلى الصفحة الرئيسية
            <i class="bi bi-arrow-left"></i>
        </a>

        <!-- أيقونة وداع (تزيينية) -->
        <div class="farewell-icon">
            <i class="bi bi-heart"></i>
        </div>
    </div>
</div>
{% endblock %}
